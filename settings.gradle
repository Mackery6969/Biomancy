pluginManagement {
	repositories {
		gradlePluginPortal()
		maven {
			name = "NeoForged"
			url = uri("https://maven.neoforged.net/releases")
			content {
				includeGroup("net.neoforged")
			}
		}
		maven {
			name = "KikuGie"
			url = uri("https://maven.kikugie.dev/releases")
			content {
				includeGroup("dev.kikugie")
			}
		}
		mavenCentral()
	}

	plugins {
		id 'net.neoforged.moddev' version '2.0.147'
		id 'net.neoforged.moddev.repositories' version '2.0.147'
		id 'org.moddedmc.wiki.toolkit' version '0.5.0'
	}
}

plugins {
	// Multi-version source tree: one branch builds a jar per Minecraft version.
	// Targets and their coordinates live in stonecutter.properties.toml.
	id 'dev.kikugie.stonecutter' version '0.9.8'
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
	id 'net.neoforged.moddev.repositories'
}

stonecutter {
	// Groovy build scripts: the controller is stonecutter.gradle and every version
	// subproject is built by the shared build.gradle in this directory.
	kotlinController = false
	create(rootProject) {
		centralScript = 'build.gradle'
		// Exactly the Minecraft versions Geckolib -- a required dependency -- has a build for.
		// 1.21.2, 1.21.9 and the 26.x line are left out because it has none for them.
		versions(
				'1.21', '1.21.1', '1.21.3', '1.21.4', '1.21.5', '1.21.6', '1.21.7', '1.21.8',
				'1.21.10', '1.21.11')
		// The version `src/` is checked in as, and the one `git` diffs against.
		vcsVersion = '1.21.1'
	}
}

def alexsCavesRepoPath = providers.gradleProperty("alexs_caves_repo")
		.getOrElse("${rootDir}/../AlexsCaves-1.21.1/mcmodsrepo")
def alexsCavesRepoUrl = alexsCavesRepoPath.startsWith("file:") ? alexsCavesRepoPath : new File(alexsCavesRepoPath).toURI().toString()

dependencyResolutionManagement {
	repositoriesMode = RepositoriesMode.PREFER_SETTINGS
//	rulesMode = RulesMode.FAIL_ON_PROJECT_RULES

	repositories {
		maven {
			name = "Alex's Caves (source build)"
			url = uri(alexsCavesRepoUrl)
			content {
				includeGroup("com.github.alexthe668")
			}
		}
		exclusiveContent {
			forRepositories(
					mavenLocal(),
					maven {
						name = "RyanHCode Maven"
						url = uri("https://maven.ryanhcode.dev/releases")
					}
			)
			filter {
				includeGroup("dev.ryanhcode.sable")
				includeGroup("dev.ryanhcode.sable-companion")
			}
		}
		maven {
			name = "NeoForged"
			url = uri("https://maven.neoforged.net/releases")
			content {
				includeGroup("net.neoforged")
			}
		}
		maven {
			url "https://maven.sinytra.org"
		}
		maven {
			name = "ParchmentMC"
			url = uri("https://maven.parchmentmc.org")
			content {
				includeGroup("org.parchmentmc.data")
			}
		}
		mavenCentral()

		maven {
			name = "Curse Maven"
			url = uri("https://cursemaven.com")
			content {
