name: Build

on:
  push:
    paths-ignore:
      - '!.github/workflows/build.yml'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CODE_OF_CONDUCT.md'
      - 'docs/**'
      - 'media/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/FUNDING.yaml'
      - '.github/dependabot.yml'
      - '.github/workflows/ai-review.yml'
      - '.github/workflows/**'
      - 'crowdin.yml'
      - 'updates.json'
      - 'actionlint.exe'
      - '.gitignore'
      - '.editorconfig'

  pull_request:

  workflow_dispatch:
    inputs:
      all_versions:
        description: "Build every declared Minecraft version instead of the representative ci.fast subset"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    name: Versions
    uses: ./.github/workflows/versions.yml
    with:
      # Seventeen targets is a lot of Minecraft decompiles, so ordinary runs build the
      # representative ci.fast subset. Publishable versions are always included regardless.
      # Run the workflow manually with all_versions to cover the whole tree.
      fast-only: ${{ !inputs.all_versions }}

  alexs-caves:
    name: Alex's Caves
    uses: ./.github/workflows/alexs-caves.yml

  build:
    name: Minecraft ${{ matrix.version.mc }}
    needs: [versions, alexs-caves]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.versions.outputs.matrix) }}

    continue-on-error: ${{ matrix.version.experimental }}

    env:
      ALEXS_CAVES_DIR_NAME: ${{ needs.alexs-caves.outputs.dir-name }}
      MC: ${{ matrix.version.mc }}
      NEEDS_ALEXS_CAVES: ${{ matrix.version.alexs_caves }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore Alex's Caves build output
        if: ${{ matrix.version.alexs_caves }}
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/${{ env.ALEXS_CAVES_DIR_NAME }}/mcmodsrepo
          key: ${{ needs.alexs-caves.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Build with Gradle
        run: |
          args=()
          if [ "$NEEDS_ALEXS_CAVES" = "true" ]; then
            args+=("-Palexs_caves_repo=$RUNNER_TEMP/$ALEXS_CAVES_DIR_NAME/mcmodsrepo")
          fi
          ./gradlew ":${MC}:build" "${args[@]}"

      - name: Compute artifact name
        id: artifact
        env:
          RAW: ${{ github.head_ref || github.ref_name }}
        run: echo "name=${RAW//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: mod-${{ steps.artifact.outputs.name }}-${{ matrix.version.mc }}-${{ github.sha }}
          path: |
            versions/${{ matrix.version.mc }}/build/libs/*.jar
            !versions/${{ matrix.version.mc }}/build/libs/*-sources.jar
            !versions/${{ matrix.version.mc }}/build/libs/*-javadoc.jar
          if-no-files-found: error
          retention-days: 14

  submit:
    name: Submit Gradle Dependencies
    needs: alexs-caves
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    env:
      ALEXS_CAVES_DIR_NAME: ${{ needs.alexs-caves.outputs.dir-name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin

      - name: Restore Alex's Caves build output
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/${{ env.ALEXS_CAVES_DIR_NAME }}/mcmodsrepo
          key: ${{ needs.alexs-caves.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Submit dependency graph
        uses: gradle/actions/dependency-submission@v6
        with:
          additional-arguments: -Palexs_caves_repo=${{ runner.temp }}/${{ env.ALEXS_CAVES_DIR_NAME }}/mcmodsrepo
