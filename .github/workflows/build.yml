name: Build

on:
  push:

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build with Java 21
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Alex's Caves from source
        run: |
          mkdir -p "${{ runner.temp }}/alexscaves"
          cd "${{ runner.temp }}/alexscaves"
          git init -q
          git remote add origin https://github.com/Raguto/AlexsCaves-1.21.1.git
          git fetch -q --depth 1 origin d2a7b05998d85e602d86c4999e53340fb1ee9b06
          git checkout -q FETCH_HEAD
          chmod +x gradlew
          ./gradlew publish --no-daemon

      - name: Build with Gradle
        run: ./gradlew build "-Palexs_caves_repo=${{ runner.temp }}/alexscaves/mcmodsrepo"

      - name: Compute artifact name
        id: artifact
        run: |
          RAW="${{ github.head_ref || github.ref_name }}"
          echo "name=${RAW//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: mod-${{ steps.artifact.outputs.name }}-${{ github.sha }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-javadoc.jar
          if-no-files-found: error
          retention-days: 14