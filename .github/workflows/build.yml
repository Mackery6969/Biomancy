name: Build

on:
  push:

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build with Java 21
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      ALEXS_CAVES_REPO: https://github.com/Raguto/AlexsCaves-1.21.1.git
      ALEXS_CAVES_COMMIT: d2a7b05998d85e602d86c4999e53340fb1ee9b06
      ALEXS_CAVES_DIR_NAME: AlexsCaves-1.21.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache Alex's Caves build output
        id: alexs-caves-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/${{ env.ALEXS_CAVES_DIR_NAME }}/mcmodsrepo
          key: alexs-caves-mcmodsrepo-${{ runner.os }}-${{ env.ALEXS_CAVES_COMMIT }}

      - name: Build Alex's Caves from source
        if: steps.alexs-caves-cache.outputs.cache-hit != 'true'
        run: |
          git init -q "$RUNNER_TEMP/$ALEXS_CAVES_DIR_NAME"
          cd "$RUNNER_TEMP/$ALEXS_CAVES_DIR_NAME"
          git remote add origin "$ALEXS_CAVES_REPO"
          git fetch -q --depth 1 origin "$ALEXS_CAVES_COMMIT"
          git checkout -q FETCH_HEAD
          chmod +x gradlew
          ./gradlew publish --no-daemon

      - name: Build with Gradle
        run: ./gradlew build "-Palexs_caves_repo=$RUNNER_TEMP/$ALEXS_CAVES_DIR_NAME/mcmodsrepo"

      - name: Compute artifact name
        id: artifact
        env:
          RAW: ${{ github.head_ref || github.ref_name }}
        run: echo "name=${RAW//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: mod-${{ steps.artifact.outputs.name }}-${{ github.sha }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-javadoc.jar
          if-no-files-found: error
          retention-days: 14