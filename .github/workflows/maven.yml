name: Maven

# Releases publish to Maven through release.yml directly: that workflow creates
# the GitHub release with GITHUB_TOKEN, and GitHub does not raise workflow events
# for actions taken with it, so `on: release` would never fire here. This is kept
# for manual backfills of versions that missed the automatic path.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maven-publish
  cancel-in-progress: false

jobs:
  stage:
    name: Stage the Maven tree
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Publish into a staging repo
        run: ./gradlew publish

      - name: Upload the staged tree
        uses: actions/upload-artifact@v7
        with:
          name: maven-staging
          path: repo/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to maven.mackery.com
    needs: stage
    uses: Mackery6969/Maven/.github/workflows/publish.yml@main
    with:
      artifact: maven-staging
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
