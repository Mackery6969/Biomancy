name: Code quality

on:
  schedule:
    - cron: "17 18 * * 3"
  pull_request:
    types: [opened, reopened, ready_for_review, closed]
  workflow_dispatch:
    inputs:
      area:
        description: Folder to work on now (empty continues where the last pass stopped)
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read

concurrency:
  group: claude-code-quality-${{ github.event.pull_request.number || 'scheduled' }}
  cancel-in-progress: false

jobs:
  alexs-caves:
    if: github.event.action != 'closed'
    uses: ./.github/workflows/alexs-caves.yml
  quality:
    needs: alexs-caves
    if: ${{ !cancelled() && needs.alexs-caves.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HAS_CLAUDE_APP: ${{ secrets.CLAUDE_APP_PRIVATE_KEY != '' }}
      ALEXS_CAVES_DIR_NAME: ${{ needs.alexs-caves.outputs.dir-name }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        if: env.HAS_CLAUDE_APP == 'true'
        continue-on-error: true
        with:
          client-id: Iv23lizzdQw7rAtlQQsX
          private-key: ${{ secrets.CLAUDE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref }}
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/cache/restore@v6
        if: env.ALEXS_CAVES_DIR_NAME != ''
        with:
          path: ${{ runner.temp }}/${{ env.ALEXS_CAVES_DIR_NAME }}/mcmodsrepo
          key: ${{ needs.alexs-caves.outputs.cache-key }}
          fail-on-cache-miss: true
      - uses: Mackery6969/Claude-Autofix@v1
        with:
          task: quality
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github-token: ${{ steps.app.outputs.token || github.token }}
          app-slug: ${{ steps.app.outputs.app-slug }}
          area: ${{ inputs.area }}
          verify-command: ./gradlew compileJava "-Palexs_caves_repo=$RUNNER_TEMP/$ALEXS_CAVES_DIR_NAME/mcmodsrepo"
