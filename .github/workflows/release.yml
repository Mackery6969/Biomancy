name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type (also controls the GitHub prerelease flag)"
        type: choice
        options:
          - release
          - beta
          - alpha
        default: release
      changelog:
        description: "Changelog for this release (Markdown). Leave blank to pull the matching version's section from CHANGELOG.md automatically."
        type: string
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        run: ./gradlew build

      - name: Read mod version
        id: meta
        run: |
          MOD_ID=$(grep -oP '^mod_id=\K.*' gradle.properties)
          MOD_VERSION=$(grep -oP '^mod_version=\K.*' gradle.properties)
          MINECRAFT_VERSION=$(grep -oP '^minecraft_version=\K.*' gradle.properties)
          echo "mod_version=$MOD_VERSION" >> "$GITHUB_OUTPUT"
          echo "minecraft_version=$MINECRAFT_VERSION" >> "$GITHUB_OUTPUT"
          echo "name=${MOD_ID}-${MOD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${MOD_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Extract this version's changelog section
        id: changelog
        run: |
          MOD_VERSION="${{ steps.meta.outputs.mod_version }}"
          {
            echo "text<<CHANGELOG_EOF"
            if [ -f CHANGELOG.md ]; then
              awk -v ver="$MOD_VERSION" '
                /^## \[/ {
                  if (found) exit
                  if (index($0, "[" ver "]") > 0) { found=1; next }
                  next
                }
                found && /^\[[^]]+\]:/ { next }
                found { print }
              ' CHANGELOG.md
            fi
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Validate optional publish credentials
        run: |
          if [ -n "$CURSEFORGE_PROJECT_ID" ] && [ -z "$CURSEFORGE_TOKEN" ]; then
            echo "::error::CURSEFORGE_PROJECT_ID is set, but the CURSEFORGE_TOKEN repository secret is missing."
            exit 1
          fi

          if [ -n "$MODRINTH_PROJECT_ID" ] && [ -z "$MODRINTH_TOKEN" ]; then
            echo "::error::MODRINTH_PROJECT_ID is set, but the MODRINTH_TOKEN repository secret is missing."
            exit 1
          fi
        env:
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}

      - name: Publish to GitHub Releases
        uses: Kira-NT/mc-publish@v3
        with:
          name: ${{ steps.meta.outputs.name }}
          version: ${{ steps.meta.outputs.mod_version }}
          version-type: ${{ inputs.release_type }}

          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ steps.meta.outputs.tag }}
          github-prerelease: ${{ inputs.release_type != 'release' }}

          changelog: ${{ inputs.changelog != '' && inputs.changelog || steps.changelog.outputs.text }}

      - name: Publish to CurseForge
        if: ${{ vars.CURSEFORGE_PROJECT_ID != '' }}
        uses: Kira-NT/mc-publish@v3
        with:
          name: ${{ steps.meta.outputs.name }}
          version: ${{ steps.meta.outputs.mod_version }}
          version-type: ${{ inputs.release_type }}
          changelog: ${{ inputs.changelog != '' && inputs.changelog || steps.changelog.outputs.text }}
          loaders: ${{ vars.MOD_LOADERS != '' && vars.MOD_LOADERS || 'neoforge' }}
          game-versions: ${{ vars.MINECRAFT_GAME_VERSIONS != '' && vars.MINECRAFT_GAME_VERSIONS || steps.meta.outputs.minecraft_version }}
          java: ${{ vars.JAVA_VERSIONS != '' && vars.JAVA_VERSIONS || '21' }}

          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-dependencies: ${{ vars.CURSEFORGE_DEPENDENCIES }}

      - name: Publish to Modrinth
        if: ${{ vars.MODRINTH_PROJECT_ID != '' }}
        uses: Kira-NT/mc-publish@v3
        with:
          name: ${{ steps.meta.outputs.name }}
          version: ${{ steps.meta.outputs.mod_version }}
          version-type: ${{ inputs.release_type }}
          changelog: ${{ inputs.changelog != '' && inputs.changelog || steps.changelog.outputs.text }}
          loaders: ${{ vars.MOD_LOADERS != '' && vars.MOD_LOADERS || 'neoforge' }}
          game-versions: ${{ vars.MINECRAFT_GAME_VERSIONS != '' && vars.MINECRAFT_GAME_VERSIONS || steps.meta.outputs.minecraft_version }}
          java: ${{ vars.JAVA_VERSIONS != '' && vars.JAVA_VERSIONS || '21' }}

          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-dependencies: ${{ vars.MODRINTH_DEPENDENCIES }}
