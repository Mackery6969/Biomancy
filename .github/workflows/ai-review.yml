name: AI Review

on:
  push:
    paths:
      - "src/**/*.java"

  # Resumes a review that stopped on Gemini's daily quota; shortly after it resets at midnight Pacific.
  schedule:
    - cron: "30 8 * * *"

  workflow_dispatch:
    inputs:
      full-review:
        description: Forget earlier reviews and review the whole project again
        type: boolean
        default: false

permissions:
  contents: read
  security-events: write

concurrency:
  group: ai-review
  cancel-in-progress: false

jobs:
  review:
    name: Gemini Review
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Gemini Review
        uses: Mackery6969/AI-Review@v2
        with:
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          model: gemini-3.8-flash
          include: src/**/*.java
          full-review: ${{ inputs.full-review || false }}
          instructions: >-
            Biomancy, a Minecraft mod being ported from Forge 1.20.1 to NeoForge 1.21.1.
            Watch for Forge APIs used the old way, logical-side (client/server) mistakes,
            and code that compiles but behaves differently on 1.21.1.
