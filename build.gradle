import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import org.gradle.api.services.BuildService
import org.gradle.api.services.BuildServiceParameters

// Per-version build script. Stonecutter applies this once per Minecraft version
// declared in settings.gradle, with that version's coordinates loaded from
// stonecutter.properties.toml as project properties. The root project itself is
// built by stonecutter.gradle.
plugins {
	id 'net.neoforged.moddev'
	id 'org.moddedmc.wiki.toolkit'
	id 'java-library'
	id 'maven-publish'
	id 'idea'
}

// ---------------------------------------------------------------------------
// Per-version coordinates
// ---------------------------------------------------------------------------

/** The Minecraft version this subproject builds, e.g. "1.21.1". */
def mcVersion = stonecutter.current.version

/** A value from this version's block in stonecutter.properties.toml. */
def ver = { String key -> property("deps.${key}") as String }

/** The same, but null when the version does not declare it. Used for optional integrations. */
def verOrNull = { String key -> findProperty("deps.${key}") as String }

/** True when this version declares the given optional dependency. */
def has = { String key -> findProperty("deps.${key}") != null }

def javaVersion = JavaLanguageVersion.of((findProperty('build.java') ?: '21') as int)
def mcRange = property('mc.range') as String
def packFormat = property('mc.pack_format') as String
def mixinCompatLevel = property('build.mixin_compat') as String

def mod_major_version = mod_version.tokenize('.')[0]

version = mod_version
group = mod_group_id

base {
	archivesName = "${mod_id}-neoforge-${mcVersion}"
}

java.toolchain.languageVersion = javaVersion

println "Building ${mod_id} ${mod_version} for Minecraft ${mcVersion} (NeoForge ${ver('neoforge')})"
println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

// Shared, version-independent locations. The subproject directory is versions/<mc>/,
// which Stonecutter generates, so anything checked in has to be addressed through
// rootProject.
def sharedDir = { String path -> rootProject.file(path) }

/** Datagen output is version-specific: pack formats and data schemas move between releases. */
def generatedResources = sharedDir("src/generated/${mcVersion}/resources")

sourceSets {
	main {
		resources {
			srcDir(generatedResources) // include resources generated by data generators
			exclude('.cache/') // exclude cache from data gen

			// exclude data gen for wiki
			exclude(".wiki_data/")
			exclude(".wiki_content/")
		}
	}
	datagen {}
}

neoForge {
	version = ver('neoforge')

	if (has('parchment')) {
		parchment {
			mappingsVersion = ver('parchment')
			minecraftVersion = ver('parchment_mc')
		}
	}

	// This line is optional. Access Transformers are automatically detected
	// accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

	addModdingDependenciesTo sourceSets.datagen

	runs {
		client {
			client()
			gameDirectory = sharedDir("runs/${mcVersion}/client")

			// Hot-Swapping via JBR, includes schema changes
			jvmArguments = ["-XX:+IgnoreUnrecognizedVMOptions", "-XX:+AllowEnhancedClassRedefinition"]

			systemProperty("mixin.debug.export", "true")
			systemProperty("mixin.debug.verbose", "true")
			//add dumpTargetOnFailure

			systemProperty('neoforge.enabledGameTestNamespaces', project.mod_id)
		}

		client2 {
			client()
			gameDirectory = sharedDir("runs/${mcVersion}/client")
			programArguments = ['--username', 'Dev2']
		}

		server {
			server()
			gameDirectory = sharedDir("runs/${mcVersion}/server")

			// Hot-Swapping via JBR, includes schema changes
			jvmArguments = ["-XX:+IgnoreUnrecognizedVMOptions", "-XX:+AllowEnhancedClassRedefinition"]

			systemProperty("mixin.debug.export", "true")
			systemProperty("mixin.debug.verbose", "true")

			programArgument('--nogui')
			systemProperty('neoforge.enabledGameTestNamespaces', project.mod_id)
		}

		gameTestServer {
			type = "gameTestServer"
			gameDirectory = sharedDir("runs/${mcVersion}/game-test")
			systemProperty('neoforge.enabledGameTestNamespaces', project.mod_id)
		}

		data {
			data()
			gameDirectory = sharedDir("runs/${mcVersion}/data")

			systemProperty("wiki.docs", sharedDir('docs').getAbsolutePath())

			// Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
			programArguments.addAll '--mod', project.mod_id, '--all', '--output', generatedResources.getAbsolutePath(), '--existing', sharedDir('src/main/resources').getAbsolutePath()

			mods {
				"${mod_id}" {
					sourceSet(sourceSets.datagen)
				}
			}
		}

		configureEach {
			systemProperty('neoforge.logging.markers', 'REGISTRIES')
			systemProperty('terminal.jline', 'true') // enable interactive & colored terminal features

			// https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
			logLevel = org.slf4j.event.Level.DEBUG
			systemProperty("neoforge.logging.console.level", "debug") //force debug level with system property

			systemProperty('geckolib.disable_examples', 'true')
			systemProperty('biomancy.dev_mode', 'true') //enable dev items, etc
		}
	}

	mods {
		// define mod <-> source bindings
		// these are used to tell the game which sources are for which mod
		// mostly optional in a single mod project
		// but multi mod projects should define one per mod
		"${mod_id}" {
			sourceSet(sourceSets.main)
		}
	}
}

// The datagen source set is not the main one, so Stonecutter has to be told to run
// its comment directives over it too.
stonecutter.tasks.configureSource(sourceSets.datagen)

configurations {
	runtimeClasspath.extendsFrom localRuntime
}

dependencies {
	api("org.jspecify:jspecify:1.0.1")
	datagenCompileOnly("org.jspecify:jspecify:1.0.1")
	api('org.jetbrains:annotations:26.1.0')

	//https://h2database.com/html/mvstore.html
	implementation(jarJar("com.h2database:h2-mvstore") {
		version {
			strictly '[2.3.230,3.0.0)'
			prefer '2.5.250'
		}
	})
	// The jar-in-jar copy is not on the classpath in a dev run, so h2 has to be added to
	// the run classpath separately. ModDevGradle removed additionalRuntimeClasspath for
	// newer Minecraft versions, where localRuntime does the same job; both keep it out of
	// the published metadata, unlike runtimeOnly.
	if (neoForge.versionCapabilities.legacyClasspath) {
		additionalRuntimeClasspath "com.h2database:h2-mvstore:2.5.250"
	} else {
		localRuntime "com.h2database:h2-mvstore:2.5.250"
	}

	// Every mod dependency below is declared per Minecraft version. A version that does
	// not list it in stonecutter.properties.toml skips it here, and the matching
	// Stonecutter constant switches off the source that uses it. Geckolib is required at
	// runtime, but it is still looked up this way so that a version which has no
	// Geckolib build yet fails when it is compiled rather than when the tree is
	// configured -- otherwise an unported version would break every other version too.

	// Geckolib
	if (has('geckolib')) {
		implementation("software.bernie.geckolib:geckolib-neoforge-${mcVersion}:${ver('geckolib')}")
		datagenCompileOnly("software.bernie.geckolib:geckolib-neoforge-${mcVersion}:${ver('geckolib')}")
	}
	if (has('mclib')) {
		implementation("com.eliotlash.mclib:mclib:${ver('mclib')}")
	}

	// Pehkui mod for rescaling of Mobs/Players
	if (has('pehkui')) {
		implementation("maven.modrinth:pehkui:${ver('pehkui')}")
	}

	// JEI
	if (has('jei')) {
		compileOnly("mezz.jei:jei-${mcVersion}-common-api:${ver('jei')}")
		compileOnly("mezz.jei:jei-${mcVersion}-neoforge-api:${ver('jei')}") // compile against the JEI API but do not include it at runtime
		localRuntime("mezz.jei:jei-${mcVersion}-neoforge:${ver('jei')}") // at runtime, use the full JEI jar
	}

	// KubeJS
	if (has('kubejs')) {
		compileOnly("dev.latvian.mods:kubejs-neoforge:${ver('kubejs')}")
	}

	// Sable API for optional block physics support
	if (has('sable')) {
		compileOnly("dev.ryanhcode.sable:sable-common-${mcVersion}:${ver('sable')}") {
			transitive = false
		}
		// Sable.HELPER's type lives in the companion artifact
		compileOnly("dev.ryanhcode.sable-companion:sable-companion-common-${mcVersion}:${ver('sable_companion')}") {
			transitive = false
		}
	}

	if (has('farmers_delight')) {
		implementation("maven.modrinth:farmers-delight:${ver('farmers_delight')}")
		datagenCompileOnly("maven.modrinth:farmers-delight:${ver('farmers_delight')}")
	}

	if (has('overweight_farming')) {
		implementation("maven.modrinth:overweight-farming:${ver('overweight_farming')}")
		datagenCompileOnly("maven.modrinth:overweight-farming:${ver('overweight_farming')}")
	}

	if (has('sons_of_sins')) {
		implementation("maven.modrinth:sons-of-sins:${ver('sons_of_sins')}")
		datagenCompileOnly("maven.modrinth:sons-of-sins:${ver('sons_of_sins')}")
	}

	if (has('alexs_caves')) {
		compileOnly("com.github.alexthe668:AlexsCaves-${mcVersion}:${ver('alexs_caves')}")
		datagenCompileOnly("com.github.alexthe668:AlexsCaves-${mcVersion}:${ver('alexs_caves')}")
	}

	datagenCompileOnly sourceSets.main.output
	localRuntime sourceSets.datagen.output
}

/**
 * Mod dependency entries for neoforge.mods.toml. Built here rather than in the template so
 * that a Minecraft version which has no Geckolib, JEI or Sable build simply does not
 * declare a dependency on it.
 */
def modDependencies = {
	def entries = []
	if (has('geckolib')) {
		entries << ['geckolib', 'required', ver('geckolib_range'), 'BEFORE']
	}
	if (has('jei')) {
		entries << ['jei', 'optional', ver('jei_range'), 'BEFORE']
	}
	if (has('sable')) {
		entries << ['sable', 'optional', ver('sable_range'), 'AFTER']
	}
	entries.collect { modId, type, range, ordering ->
		"""
[[dependencies.${mod_id}]]
modId = "${modId}"
type = "${type}"
versionRange = "${range}"
ordering = "${ordering}"
side = "BOTH"
"""
	}.join('').trim()
}()

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
	var replaceProperties = [
			minecraft_version    : mcVersion, minecraft_version_range: mcRange,
			pack_format          : packFormat,
			mixin_compat_level   : mixinCompatLevel,
			neoforge_version     : ver('neoforge'), neoforge_version_range: ver('neoforge_range'),
			loader_version_range : ver('loader_range'),

			mod_id               : mod_id,
			mod_name             : mod_name,
			mod_license          : mod_license,
			mod_version          : mod_version,
			mod_authors          : mod_authors,
			mod_credits          : mod_credits,
			mod_description      : mod_description,
			mod_url              : mod_url,
			mod_issue_url        : mod_issue_url,
			mod_update_url       : mod_update_url,

			mod_dependencies     : modDependencies
	]
	inputs.properties replaceProperties
	expand replaceProperties
	from sharedDir("src/main/templates")
	into "build/generated/sources/modMetadata"
}

var minifyJsonResources = tasks.register("minifyJsonResources") {
	inputs.files(processResources.outputs.files)

	doLast { task ->
		inputs.files.files.each { root ->
			if (!root.exists()) return

			root.eachFileRecurse { file ->
				if (file.name.endsWith(".json")) {
					file.text = JsonOutput.toJson(new JsonSlurper().parse(file))
					logger.info("Minified: {}", file)
				}
			}
		}
	}
}

jar {
	dependsOn(minifyJsonResources)

	manifest.attributes([
			'Specification-Title'     : mod_name,
			'Specification-Vendor'    : mod_vendor,
			'Specification-Version'   : mod_major_version,
			'Implementation-Title'    : rootProject.name, // project.name is the version subproject, e.g. "1.21.1"
			'Implementation-Version'  : project.jar.archiveVersion,
			'Implementation-Vendor'   : mod_vendor,
			'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
	])

	//copy files from the repository root into the jar
	from(rootProject.layout.projectDirectory) {
		include 'CREDITS.md', 'LICENSE.txt', '3RD_PARTY_LICENSE.txt'
	}
}

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Minecraft has to be decompiled before the sources that reference it are generated.
tasks.named('createMinecraftArtifacts').configure {
	dependsOn 'stonecutterGenerate'
}

// One Minecraft decompile at a time. Building several versions in one invocation with
// org.gradle.parallel would otherwise run them concurrently and exhaust memory.
def minecraftDecompileMutex = gradle.sharedServices.registerIfAbsent('minecraftDecompileMutex', MinecraftDecompileMutex) {
	maxParallelUsages = 1
}
tasks.matching { it.name == 'createMinecraftArtifacts' }.configureEach {
	usesService(minecraftDecompileMutex)
}

publishing {
	publications {
		register('mavenJava', MavenPublication) {
			from components.java
		}
	}
	repositories {
		maven {
			// One staging tree for every version: the artifact ids differ by Minecraft version.
			url = rootProject.layout.projectDirectory.dir("repo").asFile.toURI()
		}
	}
}

/** Collects this version's jars where the release workflow expects to find them. */
tasks.register('buildAndCollect', Copy) {
	group = 'build'
	description = "Builds the mod jar for Minecraft ${mcVersion} and copies it to build/libs/${mod_version}/"

	from tasks.named('jar').flatMap { it.archiveFile }
	into rootProject.layout.buildDirectory.dir("libs/${mod_version}")
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
	options.compilerArgs << '-Xmaxerrs' << '100000'
}

idea {
	module {
		downloadSources = true
		downloadJavadoc = true
	}
}

wiki {
	docs {
		biomancy {
			root = sharedDir('docs')
		}
	}
}

tasks.register("cleanWikiData") {
	def root = sharedDir("docs/.data")

	doLast {
		root.listFiles()?.each { namespaceFolder ->
			if (namespaceFolder.isDirectory()) {
				def tagsFolder = new File(namespaceFolder, "tags")
				if (tagsFolder.exists()) {
					if (!tagsFolder.deleteDir()) {
						throw new GradleException("Failed to delete folder: $tagsFolder")
					}
				}

				def recipeFolder = new File(namespaceFolder, "recipe")
				if (recipeFolder.exists()) {
					if (!recipeFolder.deleteDir()) {
						throw new GradleException("Failed to delete folder: $recipeFolder")
					}
				}

				if (namespaceFolder.listFiles()?.length == 0) {
					if (!namespaceFolder.delete()) {
						throw new GradleException("Failed to delete folder: $namespaceFolder")
					}
				}
			}
		}
	}
}

tasks.register("copyDataToWiki", Copy) {
	dependsOn("runData")
	dependsOn("cleanWikiData")

	def outputFolder = sharedDir("docs/.data")
	includeEmptyDirs = false

	from(new File(generatedResources, "data")) {
		include("**/tags/**/*.json")
	}
	from(new File(generatedResources, ".wiki_data"))
	from(sharedDir("src/main/resources/data")) {
		include("**/tags/**/*.json")
	}
	into(outputFolder)

	//transform legacy plural tag folder names (pre-1.21) to the current singular format, in case any linger
	def renameMap = [
			'tags/items/'       : 'tags/item/',
			'tags/blocks/'      : 'tags/block/',
			'tags/entity_types/': 'tags/entity_type/',
			'tags/fluids/'      : 'tags/fluid/',
			'tags/game_events/' : 'tags/game_event/'
	]

	eachFile { file ->
		renameMap.each { oldPathPart, newPathPart ->
			if (file.path.contains(oldPathPart)) {
				file.path = file.path.replaceFirst(oldPathPart, newPathPart)
			}
		}
	}
}

tasks.named("runData") {
	finalizedBy("copyDataToWiki")
}

/** Serialises Minecraft decompilation across version subprojects. See usesService above. */
interface MinecraftDecompileMutex extends BuildService<BuildServiceParameters.None> {}
