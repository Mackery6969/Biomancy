import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
	id 'net.neoforged.moddev'
	id 'org.moddedmc.wiki.toolkit'
	id 'java-library'
	id 'maven-publish'
	id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
	distributionType = Wrapper.DistributionType.ALL
}

def mod_version = mod_major_version + '.' + mod_semantic_version

version = mod_version
group = mod_group_id

base {
	archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

sourceSets {
	main {
		resources {
			srcDir('src/generated/resources') // include resources generated by data generators
			exclude('.cache/') // exclude cache from data gen

			// exclude data gen for wiki
			exclude(".wiki_data/")
			exclude(".wiki_content/")
		}
	}
	datagen {}
}

neoForge {
	version = project.neoforge_version

	parchment {
		mappingsVersion = project.parchment_mappings_version
		minecraftVersion = project.parchment_minecraft_version
	}

	// This line is optional. Access Transformers are automatically detected
	// accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

	addModdingDependenciesTo sourceSets.datagen

	runs {
		client {
			client()
			gameDirectory = project.file('runs/client')

			// Hot-Swapping via JBR, includes schema changes
			jvmArguments = ["-XX:+IgnoreUnrecognizedVMOptions", "-XX:+AllowEnhancedClassRedefinition"]

			systemProperty("mixin.debug.export", "true")
			systemProperty("mixin.debug.verbose", "true")
			//add dumpTargetOnFailure

			systemProperty('neoforge.enabledGameTestNamespaces', project.mod_id)
		}

		client2 {
			client()
			gameDirectory = project.file('runs/client')
			programArguments = ['--username', 'Dev2']
		}

		server {
			server()
			gameDirectory = project.file('runs/server')

			// Hot-Swapping via JBR, includes schema changes
			jvmArguments = ["-XX:+IgnoreUnrecognizedVMOptions", "-XX:+AllowEnhancedClassRedefinition"]

			systemProperty("mixin.debug.export", "true")
			systemProperty("mixin.debug.verbose", "true")

			programArgument('--nogui')
			systemProperty('neoforge.enabledGameTestNamespaces', project.mod_id)
		}

		// This run config launches GameTestServer and runs all registered game tests, then exits.
		// By default, the server will crash when no game tests are provided.
		// The game test system is also enabled by default for other run configs under the /test command.
		gameTestServer {
			type = "gameTestServer"
			gameDirectory = project.file('runs/game-test')
			systemProperty('neoforge.enabledGameTestNamespaces', project.mod_id)
		}

		data {
			data()
			gameDirectory = project.file('runs/data')

			systemProperty("wiki.docs", file('docs/').getAbsolutePath())

			// Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
			programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()

			mods {
				"${mod_id}" {
					sourceSet(sourceSets.datagen)
				}
			}
		}

		configureEach {
			systemProperty('neoforge.logging.markers', 'REGISTRIES')
			systemProperty('terminal.jline', 'true') // enable interactive & colored terminal features

			// https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
			logLevel = org.slf4j.event.Level.DEBUG
			systemProperty("neoforge.logging.console.level", "debug") //force debug level with system property

			systemProperty('geckolib.disable_examples', 'true')
			systemProperty('biomancy.dev_mode', 'true') //enable dev items, etc
		}
	}

	mods {
		// define mod <-> source bindings
		// these are used to tell the game which sources are for which mod
		// mostly optional in a single mod project
		// but multi mod projects should define one per mod
		"${mod_id}" {
			sourceSet(sourceSets.main)
		}
	}
}

// Mixins are declared declaratively via [[mixins]] entries in neoforge.mods.toml (NeoForge 20.3+) -
// no Gradle-side mixin configuration is needed, and MixinExtras ships bundled with NeoForge.

// Sets up a dependency configuration called 'localRuntime'.
// This should be used instead of 'runtimeOnly' to declare a dependency that will be
// present for runtime testing but that is "optional", meaning it will not be pulled
// by dependents of this mod. Unlike the old Forge/legacyForge setup, NeoForge dependencies
// are already Mojmap and need no deobfuscation/remapping configuration.
configurations {
	runtimeClasspath.extendsFrom localRuntime
}

dependencies {
	api("org.jspecify:jspecify:1.0.0")
	datagenCompileOnly("org.jspecify:jspecify:1.0.0")
	api('org.jetbrains:annotations:26.0.2-1')

	//https://h2database.com/html/mvstore.html
	implementation(jarJar("com.h2database:h2-mvstore") {
		version {
			strictly '[2.3.230,3.0.0)'
			prefer '2.3.232'
		}
	})
	additionalRuntimeClasspath "com.h2database:h2-mvstore:2.3.232"

	// Geckolib
	implementation("software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}")
	implementation("com.eliotlash.mclib:mclib:20")
	datagenCompileOnly("software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}")

	// Pehkui mod for rescaling of Mobs/Players
	implementation("maven.modrinth:pehkui:${pehkui_version}")

	// JEI
	compileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
	compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}") // compile against the JEI API but do not include it at runtime
	localRuntime("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}") // at runtime, use the full JEI jar

	implementation("maven.modrinth:farmers-delight:${farmers_delight_version}")
	datagenCompileOnly("maven.modrinth:farmers-delight:${farmers_delight_version}")

	implementation("maven.modrinth:overweight-farming:${overweight_farming_version}")
	datagenCompileOnly("maven.modrinth:overweight-farming:${overweight_farming_version}")

	implementation("maven.modrinth:sons-of-sins:${sons_of_sins_version}")
	datagenCompileOnly("maven.modrinth:sons-of-sins:${sons_of_sins_version}")

	datagenCompileOnly sourceSets.main.output
	localRuntime sourceSets.datagen.output
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
	var replaceProperties = [
			minecraft_version    : minecraft_version, minecraft_version_range: minecraft_version_range,
			neoforge_version     : neoforge_version, neoforge_version_range: neoforge_version_range,
			loader_version_range : loader_version_range,

			mod_id               : mod_id,
			mod_name             : mod_name,
			mod_license          : mod_license,
			mod_version          : mod_version,
			mod_authors          : mod_authors,
			mod_credits          : mod_credits,
			mod_description      : mod_description,
			mod_url              : mod_url,
			mod_issue_url        : mod_issue_url,
			mod_update_url       : mod_update_url,

			geckolib_version     : geckolib_version, geckolib_version_range: geckolib_version_range,
			jei_version          : jei_version, jei_version_range: jei_version_range
	]
	inputs.properties replaceProperties
	expand replaceProperties
	from "src/main/templates"
	into "build/generated/sources/modMetadata"
}

var minifyJsonResources = tasks.register("minifyJsonResources") {
	inputs.files(processResources.outputs.files)

	doLast { task ->
		inputs.files.files.each { root ->
			if (!root.exists()) return

			root.eachFileRecurse { file ->
				if (file.name.endsWith(".json")) {
					file.text = JsonOutput.toJson(new JsonSlurper().parse(file))
					logger.info("Minified: {}", file)
				}
			}
		}
	}
}

jar {
	dependsOn(minifyJsonResources)

	manifest.attributes([
			'Specification-Title'     : mod_name,
			'Specification-Vendor'    : mod_vendor,
			'Specification-Version'   : mod_major_version,
			'Implementation-Title'    : project.name,
			'Implementation-Version'  : project.jar.archiveVersion,
			'Implementation-Vendor'   : mod_vendor,
			'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
	])

	from { ["CREDITS.md", "LICENSE.txt", "3RD_PARTY_LICENSE.txt"] } //copy files from the repository root into the jar
}

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

publishing {
	publications {
		register('mavenJava', MavenPublication) {
			from components.java
		}
	}
	repositories {
		maven {
			url "file://${project.projectDir}/repo"
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

idea {
	module {
		downloadSources = true
		downloadJavadoc = true
	}
}

wiki {
	docs {
		biomancy {
			root = file('docs')
		}
	}
}

tasks.register("cleanWikiData") {
	def root = file("docs/.data")

	doLast {
		root.listFiles()?.each { namespaceFolder ->
			if (namespaceFolder.isDirectory()) {
				def tagsFolder = new File(namespaceFolder, "tags")
				if (tagsFolder.exists()) {
					if (!tagsFolder.deleteDir()) {
						throw new GradleException("Failed to delete folder: $tagsFolder")
					}
				}

				def recipeFolder = new File(namespaceFolder, "recipe")
				if (recipeFolder.exists()) {
					if (!recipeFolder.deleteDir()) {
						throw new GradleException("Failed to delete folder: $recipeFolder")
					}
				}

				if (namespaceFolder.listFiles()?.length == 0) {
					if (!namespaceFolder.delete()) {
						throw new GradleException("Failed to delete folder: $namespaceFolder")
					}
				}
			}
		}
	}
}

tasks.register("copyDataToWiki", Copy) {
	dependsOn("runData")
	dependsOn("cleanWikiData")

	def outputFolder = file("docs/.data")
	includeEmptyDirs = false

	from("src/generated/resources/data") {
		include("**/tags/**/*.json")
	}
	from("src/generated/resources/.wiki_data")
	from("src/main/resources/data") {
		include("**/tags/**/*.json")
	}
	into(outputFolder)

	//transform legacy plural tag folder names (pre-1.21) to the current singular format, in case any linger
	def renameMap = [
			'tags/items/'       : 'tags/item/',
			'tags/blocks/'      : 'tags/block/',
			'tags/entity_types/': 'tags/entity_type/',
			'tags/fluids/'      : 'tags/fluid/',
			'tags/game_events/' : 'tags/game_event/'
	]

	eachFile { file ->
		renameMap.each { oldPathPart, newPathPart ->
			if (file.path.contains(oldPathPart)) {
				file.path = file.path.replaceFirst(oldPathPart, newPathPart)
			}
		}
	}
}

tasks.named("runData") {
	finalizedBy("copyDataToWiki")
}
